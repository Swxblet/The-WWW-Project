<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The World Wide Web — A Timeline Tribute</title>
    <meta
      name="description"
      content="A scroll-driven timeline tribute to the first World Wide Web page by Tim Berners-Lee: from the line-mode terminal and the 1990 original to the present web. Same document, presented through time."
    >
    <meta name="author" content="Educational tribute — not an official CERN site">
    <meta name="theme-color" content="#0a0f0a">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
    <link rel="canonical" href="https://wwwproject.codepixels.dev/">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="The World Wide Web — A Timeline Tribute">
    <meta property="og:url" content="https://wwwproject.codepixels.dev/">
    <meta property="og:locale" content="en_US">
    <meta property="og:title" content="The World Wide Web — A Timeline Tribute">
    <meta
      property="og:description"
      content="The first web page, kept intact — from a line-mode terminal in 1989 to the present web."
    >
    <meta property="og:image" content="https://wwwproject.codepixels.dev/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Atom mark in CERN blue on paper — timeline tribute to the first web page">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="The World Wide Web — A Timeline Tribute">
    <meta
      name="twitter:description"
      content="The first web page, kept intact — from a line-mode terminal in 1989 to the present web."
    >
    <meta name="twitter:image" content="https://wwwproject.codepixels.dev/og-image.png">
    <meta name="twitter:image:alt" content="Atom mark in CERN blue on paper — timeline tribute to the first web page">
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebPage",
        "name": "The World Wide Web — A Timeline Tribute",
        "url": "https://wwwproject.codepixels.dev/",
        "description": "A timeline tribute to the first World Wide Web page (info.cern.ch, Tim Berners-Lee, 1990). Educational tribute, not an official CERN site.",
        "about": "https://home.web.cern.ch/topics/birth-web",
        "isBasedOn": "http://info.cern.ch/hypertext/WWW/TheProject.html"
      }
    </script>
    <script>
      try {
        var stored = localStorage.getItem('www-theme');
        var dark =
          stored === 'dark' ||
          (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (e) {
        document.documentElement.dataset.theme = 'light';
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
